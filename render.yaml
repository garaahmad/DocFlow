# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: docflow-postgres
    databaseName: docflow
    plan: basic-1gb
    postgresMajorVersion: "17"
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: docflow-queue
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: docflow-ai
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: DATABASE_URL
        fromDatabase:
          name: docflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: docflow-queue
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - fromGroup: docflow-storage
      - key: GEMINI_EXTRACTION_API_KEY
        sync: false
      - key: GEMINI_INSIGHTS_API_KEY
        sync: false
      - key: GEMINI_INSIGHTS_MODEL
        value: gemini-3.1-flash-lite

  - type: worker
    name: docflow-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate
    startCommand: npm run worker
    maxShutdownDelaySeconds: 180
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: DATABASE_URL
        fromDatabase:
          name: docflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: docflow-queue
          property: connectionString
      - fromGroup: docflow-storage
      - key: GEMINI_EXTRACTION_API_KEY
        sync: false
      - key: GEMINI_VALIDATION_API_KEY
        sync: false
      - key: GEMINI_EXTRACTION_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_VALIDATION_MODEL
        value: gemini-3.1-flash-lite

envVarGroups:
  - name: docflow-storage
    envVars:
      - key: S3_REGION
        value: us-east-1
      - key: S3_PATH_STYLE
        value: "false"
